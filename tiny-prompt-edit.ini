[general]
language = en

[window]
width = 800
height = 400
x = center
y = center
border = 5
borderless = false
always_on_top = false
alpha = 0.92

[editor]
font = Consolas
font_size = 11
zoom_step = 1
zoom_modifier = Control
min_font_size = 6
max_font_size = 40
show_line_numbers = false
show_scrollbars = true
word_wrap = true
large_file_threshold_mb = 2
close_shortcuts = Control+X, Escape
